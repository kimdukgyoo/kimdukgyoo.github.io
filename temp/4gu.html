<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2723">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>4구 점수판</title>
<style>
:root{
  --cloth:#0B2723;
  --cloth-2:#123A33;
  --cloth-3:#17463D;
  --rail:#6E432C;
  --rail-lt:#A9744B;
  --white-ball:#F4EEE2;
  --yellow-ball:#F0BE3C;
  --red:#C6362C;
  --ink:#F4EEE2;
  --dim:rgba(244,238,226,.56);
  --faint:rgba(244,238,226,.30);
  --line:rgba(244,238,226,.13);
  --accent:var(--white-ball);
  --accent-ink:#0B2723;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","DejaVu Sans Mono","Roboto Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--cloth);
  color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--rail-lt);outline-offset:2px}

#app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  max-width:560px;margin:0 auto;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

/* ── 상단 레일 ── */
.rail{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px 16px 9px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(110,67,44,.30),transparent);
}
.rail .mark{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;
  color:var(--rail-lt);text-transform:uppercase;
}
.rail .spacer{flex:1}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;
  color:var(--dim);border:1px solid var(--line);
}
.icon-btn:active{background:rgba(244,238,226,.07)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── 플레이어 카드 ── */
.cards{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.card{
  flex:1 1 50%;position:relative;min-height:0;
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  transition:opacity .22s ease, background .22s ease;
  opacity:.42;
}
.card+.card{border-top:1px solid var(--line)}
.card.on{opacity:1;background:var(--cloth-2)}
/* 시그니처: 당구대 조명 */
.card.on::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 150% at 50% -30%, rgba(244,238,226,.13), transparent 62%);
}
.ball{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  box-shadow:inset -3px -4px 7px rgba(0,0,0,.35), inset 2px 3px 5px rgba(255,255,255,.45);
}
.ball.white{background:var(--white-ball)}
.ball.yellow{background:var(--yellow-ball)}
.card.on .ball{box-shadow:inset -3px -4px 7px rgba(0,0,0,.35), inset 2px 3px 5px rgba(255,255,255,.45), 0 0 0 4px rgba(244,238,226,.10)}

.meta{flex:1 1 auto;min-width:0}
.name{
  font-size:15px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name em{
  font-style:normal;font-family:var(--mono);font-size:11px;
  color:var(--rail-lt);margin-left:8px;letter-spacing:.02em;
}
.stats{
  margin-top:5px;font-family:var(--mono);font-size:11px;
  color:var(--dim);letter-spacing:.02em;
  display:flex;flex-wrap:wrap;gap:4px 12px;
}
.stats b{font-weight:600;color:var(--ink);opacity:.85}
.run{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:7px;padding:3px 9px;border-radius:99px;
  background:var(--accent);color:var(--accent-ink);
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;
}
.run[hidden]{display:none}

.score{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.score .lbl{
  font-size:10px;letter-spacing:.16em;color:var(--faint);
  text-transform:uppercase;font-weight:500;
}
.score .now{font-size:clamp(46px,15vw,78px);font-weight:700;letter-spacing:-.04em;line-height:.92}
.score .now.over{color:var(--red)}

/* ── 이닝 표시 ── */
.inning-bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:9px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--cloth);
}
.inning-bar .n{
  font-family:var(--mono);font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.inning-bar .lb{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--rail-lt);text-transform:uppercase}

/* ── 이닝 기록 스트립 ── */
.strip{
  flex:0 0 auto;height:58px;display:flex;gap:3px;align-items:stretch;
  padding:8px 16px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.col{flex:0 0 auto;width:26px;display:flex;flex-direction:column;gap:2px}
.cell{
  flex:1;border-radius:3px;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:600;
  background:rgba(244,238,226,.06);color:var(--faint);
}
.cell.has{color:var(--cloth)}
.cell.has.white{background:var(--white-ball)}
.cell.has.yellow{background:var(--yellow-ball)}
.cell.zero{color:var(--dim)}
.cell.minus{background:rgba(198,54,44,.85);color:#fff}
.cell.live{outline:1px dashed var(--faint);outline-offset:-1px}
.col .no{
  flex:0 0 12px;text-align:center;font-family:var(--mono);
  font-size:9px;color:var(--faint);line-height:12px;
}
.strip-empty{
  display:flex;align-items:center;font-family:var(--mono);
  font-size:11px;color:var(--faint);letter-spacing:.04em;
}

/* ── 조작부 ── */
.pad{flex:0 0 auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:9px}
.btn{
  border-radius:14px;font-weight:700;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .07s ease, filter .15s ease;
}
.btn:active{transform:scale(.985)}
.btn-score{
  height:76px;font-size:21px;
  background:var(--accent);color:var(--accent-ink);
}
.btn-score .who{font-family:var(--mono);font-size:12px;font-weight:600;opacity:.62;letter-spacing:.02em}
.row{display:flex;gap:9px}
.btn-sub{
  flex:1;height:52px;font-size:15px;font-weight:600;
  border:1px solid var(--line);background:rgba(244,238,226,.05);
}
.btn-sub:active{background:rgba(244,238,226,.11)}
.btn-sub.foul{color:#EE8078;border-color:rgba(198,54,44,.4)}
.btn-sub[disabled]{opacity:.3;pointer-events:none}
.row-min{display:flex;gap:9px}
.btn-min{
  flex:1;height:40px;font-size:13px;font-weight:500;color:var(--dim);
  border:1px solid var(--line);border-radius:11px;
}
.btn-min:active{background:rgba(244,238,226,.07)}
.btn-min[disabled]{opacity:.28;pointer-events:none}

/* ── 시트 / 오버레이 ── */
.veil{
  position:fixed;inset:0;background:rgba(6,20,18,.72);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:20;padding:16px;
}
.veil[hidden]{display:none}
.sheet{
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  background:var(--cloth-2);border:1px solid var(--line);
  border-radius:20px;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  animation:up .24s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:2px}
.sheet .sub{font-size:13px;color:var(--dim);margin-bottom:18px;line-height:1.5}
.fset{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.fset .lg{
  display:flex;align-items:center;gap:8px;margin-bottom:11px;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--rail-lt);text-transform:uppercase;
}
.fset .lg .ball{width:14px;height:14px}
.frow{display:flex;gap:9px;align-items:center}
label.fld{flex:1;display:block}
label.fld span{display:block;font-size:11px;color:var(--dim);margin-bottom:5px}
input[type=text],input[type=number]{
  width:100%;height:44px;padding:0 12px;border-radius:11px;
  background:var(--cloth);border:1px solid var(--line);color:var(--ink);
  font-family:var(--sans);font-size:15px;-webkit-user-select:text;user-select:text;
}
input[type=number]{font-family:var(--mono);width:88px;flex:0 0 88px}
label.fld.num{flex:0 0 88px}
input:focus{outline:none;border-color:var(--rail-lt)}
.opt{
  display:flex;align-items:flex-start;gap:11px;padding:11px 0;cursor:pointer;
  border-top:1px solid var(--line);
}
.opt:first-of-type{border-top:none}
.opt input{
  flex:0 0 auto;width:20px;height:20px;margin-top:1px;accent-color:var(--rail-lt);
}
.opt div strong{display:block;font-size:14px;font-weight:600}
.opt div small{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.seg{display:flex;gap:6px;margin-top:2px}
.seg button{
  flex:1;height:42px;border-radius:11px;border:1px solid var(--line);
  font-size:14px;font-weight:600;color:var(--dim);
}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--cloth);border-color:var(--ink)}
.sheet-actions{display:flex;gap:9px;margin-top:16px}
.sheet-actions .btn{flex:1;height:52px;font-size:15px}
.btn-primary{background:var(--ink);color:var(--cloth)}
.btn-ghost{border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn-danger{color:#EE8078;border:1px solid rgba(198,54,44,.4);font-weight:600}

/* 종료 화면 */
.win{text-align:center;padding:8px 4px 0}
.win .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--rail-lt);text-transform:uppercase}
.win h2{font-size:26px;margin:10px 0 3px}
.win .fin{
  font-family:var(--mono);font-size:15px;color:var(--dim);
  letter-spacing:-.01em;margin:8px 0 18px;
  display:flex;align-items:baseline;justify-content:center;gap:7px;
}
.win .fin b{font-size:44px;font-weight:700;color:var(--ink);letter-spacing:-.03em}
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
.tbl th{
  font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:500;
  text-transform:uppercase;padding-bottom:7px;text-align:right;
}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px 0;border-top:1px solid var(--line);text-align:right}
.tbl td:first-child{text-align:left;font-family:var(--sans);font-size:14px}
.tbl .bd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:620px){
  .strip{height:50px}
  .btn-score{height:64px}
  .btn-sub{height:46px}
  .card{padding:10px 18px}
}
</style>
</head>
<body>

<div id="app">
  <div class="rail">
    <span class="mark">4구 점수판</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btnRecord" aria-label="기록 보기">
      <svg viewBox="0 0 24 24"><path d="M4 19V6M9 19V4M14 19v-9M19 19v-5"/></svg>
    </button>
    <button class="icon-btn" id="btnSetup" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div class="cards">
    <div class="card" id="card0">
      <span class="ball white"></span>
      <div class="meta">
        <div class="name"><span id="name0">플레이어 1</span><em id="tg0">20다마</em></div>
        <div class="stats">
          <span>친 점수 <b id="pt0">0</b></span>
          <span>애버리지 <b id="avg0">0.000</b></span>
          <span>하이런 <b id="hr0">0</b></span>
          <span>이닝 <b id="in0">0</b></span>
        </div>
        <span class="run" id="run0" hidden>이번 차례 +0</span>
      </div>
      <div class="score"><span class="lbl">남은 다마</span><span class="now" id="rem0">20</span></div>
    </div>

    <div class="card" id="card1">
      <span class="ball yellow"></span>
      <div class="meta">
        <div class="name"><span id="name1">플레이어 2</span><em id="tg1">20다마</em></div>
        <div class="stats">
          <span>친 점수 <b id="pt1">0</b></span>
          <span>애버리지 <b id="avg1">0.000</b></span>
          <span>하이런 <b id="hr1">0</b></span>
          <span>이닝 <b id="in1">0</b></span>
        </div>
        <span class="run" id="run1" hidden>이번 차례 +0</span>
      </div>
      <div class="score"><span class="lbl">남은 다마</span><span class="now" id="rem1">20</span></div>
    </div>
  </div>

  <div class="inning-bar">
    <span class="lb">이닝</span>
    <span class="n" id="inningNo">1</span>
  </div>

  <div class="strip" id="strip"></div>

  <div class="pad">
    <button class="btn btn-score" id="btnPoint">
      득점 <span class="who" id="pointWho"></span>
    </button>
    <div class="row">
      <button class="btn btn-sub" id="btnMiss">다음 차례로</button>
      <button class="btn btn-sub foul" id="btnFoul">실점 &plus;1</button>
    </div>
    <div class="row-min">
      <button class="btn-min" id="btnUndo" disabled>되돌리기</button>
      <button class="btn-min" id="btnReset">새 게임</button>
    </div>
  </div>
</div>

<!-- 설정 -->
<div class="veil" id="veilSetup" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="게임 설정">
    <h2>게임 설정</h2>
    <p class="sub">이름과 다마 수를 정하세요. 공격에 성공하면 남은 다마가 1 줄고, 상대 수구를 맞히면 1 늘어납니다. 저장하면 새 게임이 시작됩니다.</p>

    <div class="fset">
      <div class="lg"><span class="ball white"></span>흰 공</div>
      <div class="frow">
        <label class="fld"><span>이름</span><input type="text" id="f_name0" maxlength="10" placeholder="플레이어 1"></label>
        <label class="fld num"><span>다마 수</span><input type="number" id="f_tg0" min="1" max="999" inputmode="numeric"></label>
      </div>
    </div>

    <div class="fset">
      <div class="lg"><span class="ball yellow"></span>노란 공</div>
      <div class="frow">
        <label class="fld"><span>이름</span><input type="text" id="f_name1" maxlength="10" placeholder="플레이어 2"></label>
        <label class="fld num"><span>다마 수</span><input type="number" id="f_tg1" min="1" max="999" inputmode="numeric"></label>
      </div>
    </div>

    <div class="fset">
      <div class="lg">선공</div>
      <div class="seg" id="segStarter">
        <button type="button" data-v="0">흰 공 먼저</button>
        <button type="button" data-v="1">노란 공 먼저</button>
      </div>
    </div>

    <div class="fset">
      <label class="opt">
        <input type="checkbox" id="f_wake">
        <div><strong>화면 꺼짐 방지</strong>
        <small>치는 동안 폰 화면이 자동으로 꺼지지 않습니다.</small></div>
      </label>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="setupCancel">취소</button>
      <button class="btn btn-primary" id="setupSave">저장하고 시작</button>
    </div>
  </div>
</div>

<!-- 기록 -->
<div class="veil" id="veilRecord" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="기록">
    <h2>기록</h2>
    <p class="sub" id="recSub">아직 기록이 없습니다.</p>
    <table class="tbl" id="recTable"></table>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="recClose">닫기</button>
    </div>
  </div>
</div>

<!-- 종료 -->
<div class="veil" id="veilWin" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="게임 종료">
    <div class="win">
      <div class="eyebrow">게임 종료</div>
      <h2 id="winName">—</h2>
      <div class="fin" id="winFin">—</div>
    </div>
    <table class="tbl" id="winTable"></table>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="winContinue">이어서 치기</button>
      <button class="btn btn-primary" id="winNew">새 게임</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var KEY="fourball.v2";
var $=function(id){return document.getElementById(id)};
var S, history=[];

function fresh(cfg){
  cfg=cfg||{};
  var p=cfg.p||[{name:"플레이어 1",target:20},{name:"플레이어 2",target:20}];
  return {
    p:[
      {name:p[0].name,target:p[0].target,score:0,innings:0,high:0},
      {name:p[1].name,target:p[1].target,score:0,innings:0,high:0}
    ],
    starter:cfg.starter||0,
    turn:cfg.starter||0,
    run:0, inning:1, log:[], done:false, winner:null,
    wake:!!cfg.wake
  };
}

/* ── 저장 ── */
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(o&&o.p&&o.p.length===2&&typeof o.turn==="number") return o;
  }catch(e){}
  return null;
}

/* ── 상태 변경 ── */
function snap(){
  history.push(JSON.stringify(S));
  if(history.length>200) history.shift();
}
function undo(){
  if(!history.length) return;
  S=JSON.parse(history.pop());
  applyWake(); render(); save();
}

function attempts(i){
  // 진행 중인 차례도 한 이닝으로 계산
  return S.p[i].innings + ((!S.done && S.turn===i)?1:0);
}
function avg(i){
  var a=attempts(i);
  return a>0 ? (S.p[i].score/a).toFixed(3) : "0.000";
}

function addPoint(){
  if(S.done) return;
  snap();
  var t=S.turn;
  S.p[t].score++; S.run++;
  if(S.run>S.p[t].high) S.p[t].high=S.run;
  if(S.p[t].score>=S.p[t].target){
    S.p[t].innings++;
    S.log.push({i:S.inning,p:t,pts:S.run});
    S.run=0; S.done=true; S.winner=t;
    render(); save(); showWin(); return;
  }
  render(); save();
}
function endTurn(foul){
  if(S.done) return;
  snap();
  var t=S.turn;
  var deduct=foul?1:0;
  S.p[t].score-=deduct;
  var pts=S.run-deduct;
  S.p[t].innings++;
  S.log.push({i:S.inning,p:t,pts:pts,foul:!!foul});
  S.run=0;
  var second=1-S.starter;
  if(t===second) S.inning++;
  S.turn=1-t;
  render(); save();
}

/* ── 화면 ── */
function render(){
  var t=S.turn;
  document.documentElement.style.setProperty("--accent", t===0?"var(--white-ball)":"var(--yellow-ball)");
  for(var i=0;i<2;i++){
    var rem=S.p[i].target-S.p[i].score;
    $("card"+i).classList.toggle("on", !S.done && S.turn===i);
    $("name"+i).textContent=S.p[i].name;
    $("tg"+i).textContent=S.p[i].target+"다마";
    $("rem"+i).textContent=rem;
    $("rem"+i).classList.toggle("over", rem>S.p[i].target);
    $("pt"+i).textContent=S.p[i].score;
    $("avg"+i).textContent=avg(i);
    $("hr"+i).textContent=S.p[i].high;
    $("in"+i).textContent=S.p[i].innings;
    var r=$("run"+i);
    if(!S.done && S.turn===i && S.run>0){ r.hidden=false; r.textContent="이번 차례 "+S.run+"개"; }
    else r.hidden=true;
  }
  $("inningNo").textContent=S.inning;
  $("pointWho").textContent=S.done?"":S.p[t].name;
  $("btnPoint").disabled=S.done;
  $("btnMiss").disabled=S.done;
  $("btnFoul").disabled=S.done;
  $("btnUndo").disabled=history.length===0;
  drawStrip();
}

function drawStrip(){
  var el=$("strip"); el.innerHTML="";
  var maxI=S.done?S.inning:S.inning;
  if(!S.log.length && S.run===0 && S.inning===1){
    var e=document.createElement("div");
    e.className="strip-empty";
    e.textContent="이닝별 득점이 여기에 쌓입니다";
    el.appendChild(e); return;
  }
  var order=[S.starter,1-S.starter];
  for(var n=1;n<=maxI;n++){
    var col=document.createElement("div"); col.className="col";
    for(var k=0;k<2;k++){
      var pi=order[k];
      var rec=null;
      for(var j=0;j<S.log.length;j++){ if(S.log[j].i===n && S.log[j].p===pi){ rec=S.log[j]; break; } }
      var c=document.createElement("div"); c.className="cell";
      if(rec){
        c.classList.add(rec.pts>0?"has":"zero", pi===0?"white":"yellow");
        if(rec.pts<0) c.className="cell minus";
        c.textContent=rec.pts;
      }else if(!S.done && S.turn===pi && n===S.inning){
        c.classList.add("live");
        c.textContent=S.run>0?S.run:"·";
      }else{
        c.textContent="";
      }
      col.appendChild(c);
    }
    var no=document.createElement("div"); no.className="no"; no.textContent=n;
    col.appendChild(no);
    el.appendChild(col);
  }
  el.scrollLeft=el.scrollWidth;
}

function statTable(target){
  var rows="<tr><th>선수</th><th>남은 다마</th><th>친 점수</th><th>이닝</th><th>애버리지</th></tr>";
  for(var i=0;i<2;i++){
    rows+="<tr><td><span class='bd' style='background:"+(i===0?"#F4EEE2":"#F0BE3C")+"'></span>"
      +esc(S.p[i].name)+"</td><td>"+(S.p[i].target-S.p[i].score)+"</td><td>"+S.p[i].score
      +"</td><td>"+S.p[i].innings+"</td><td>"+avg(i)+"</td></tr>";
  }
  target.innerHTML=rows;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]})}

function showWin(){
  var w=S.winner, l=1-w;
  $("winName").textContent=S.p[w].name;
  $("winFin").innerHTML="<b>"+(S.p[l].target-S.p[l].score)+"</b>다마 남기고 승리";
  statTable($("winTable"));
  $("veilWin").hidden=false;
}
function showRecord(){
  var n=S.log.length;
  $("recSub").textContent = n? (S.inning-(S.done?0:0))+"이닝 진행, 총 "+n+"번의 차례가 끝났습니다."
                             : "아직 끝난 차례가 없습니다.";
  statTable($("recTable"));
  $("veilRecord").hidden=false;
}

/* ── 설정 ── */
var setupStarter=0;
function openSetup(){
  $("f_name0").value=S.p[0].name; $("f_tg0").value=S.p[0].target;
  $("f_name1").value=S.p[1].name; $("f_tg1").value=S.p[1].target;
  $("f_wake").checked=S.wake;
  setupStarter=S.starter; paintSeg();
  $("veilSetup").hidden=false;
}
function paintSeg(){
  var b=$("segStarter").children;
  for(var i=0;i<b.length;i++) b[i].setAttribute("aria-pressed", String(i)===String(setupStarter));
}
function saveSetup(){
  var n0=($("f_name0").value||"").trim()||"플레이어 1";
  var n1=($("f_name1").value||"").trim()||"플레이어 2";
  var t0=Math.max(1,Math.min(999,parseInt($("f_tg0").value,10)||20));
  var t1=Math.max(1,Math.min(999,parseInt($("f_tg1").value,10)||20));
  S=fresh({p:[{name:n0,target:t0},{name:n1,target:t1}],starter:+setupStarter,
           wake:$("f_wake").checked});
  history=[];
  $("veilSetup").hidden=true; $("veilWin").hidden=true;
  applyWake(); render(); save();
}
function newGame(){
  S=fresh({p:[{name:S.p[0].name,target:S.p[0].target},{name:S.p[1].name,target:S.p[1].target}],
           starter:S.starter, wake:S.wake});
  history=[];
  $("veilWin").hidden=true;
  render(); save();
}

/* ── 화면 꺼짐 방지 ── */
var lock=null;
function applyWake(){
  if(S.wake) requestWake(); else releaseWake();
}
function requestWake(){
  if(!("wakeLock" in navigator)||lock) return;
  navigator.wakeLock.request("screen").then(function(l){
    lock=l; l.addEventListener("release",function(){lock=null});
  }).catch(function(){});
}
function releaseWake(){ if(lock){ try{lock.release()}catch(e){} lock=null; } }
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&S&&S.wake) requestWake();
});

/* ── 연결 ── */
$("btnPoint").addEventListener("click",addPoint);
$("btnMiss").addEventListener("click",function(){endTurn(false)});
$("btnFoul").addEventListener("click",function(){endTurn(true)});
$("btnUndo").addEventListener("click",undo);
$("btnReset").addEventListener("click",function(){
  if(confirm("점수를 모두 지우고 새 게임을 시작할까요?")) newGame();
});
$("btnSetup").addEventListener("click",openSetup);
$("btnRecord").addEventListener("click",showRecord);
$("setupCancel").addEventListener("click",function(){$("veilSetup").hidden=true});
$("setupSave").addEventListener("click",saveSetup);
$("recClose").addEventListener("click",function(){$("veilRecord").hidden=true});
$("winContinue").addEventListener("click",function(){
  S.done=false; S.winner=null; $("veilWin").hidden=true; render(); save();
});
$("winNew").addEventListener("click",newGame);
$("segStarter").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  setupStarter=b.dataset.v; paintSeg();
});
[ "veilSetup","veilRecord" ].forEach(function(id){
  $(id).addEventListener("click",function(e){ if(e.target===this) this.hidden=true; });
});
document.addEventListener("keydown",function(e){
  if(!$("veilSetup").hidden||!$("veilRecord").hidden) return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();addPoint()}
  else if(e.key==="ArrowRight"||e.key.toLowerCase()==="n"){e.preventDefault();endTurn(false)}
  else if(e.key.toLowerCase()==="f"){e.preventDefault();endTurn(true)}
  else if(e.key.toLowerCase()==="z"){e.preventDefault();undo()}
});

/* ── 시작 ── */
var saved=load();
S=saved||fresh();
applyWake(); render();
if(!saved) openSetup();
})();
</script>
</body>
